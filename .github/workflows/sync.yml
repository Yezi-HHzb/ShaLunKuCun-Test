name: Manual Sync Feishu Data and QR Codes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-feishu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Feishu data and build QR workbook
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          SITE_BASE_URL: https://yezi-hhzb.github.io/ShaLunKuCun-Test/
        run: python scripts/sync_feishu.py

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json qr_manifest.json qrcodes "E10库存二维码.xlsx"
          git diff --cached --quiet || git commit -m "Update Feishu data and QR workbook"
          git push
